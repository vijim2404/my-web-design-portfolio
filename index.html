<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viji Web | Professional Website Design Portfolio</title>
<meta name="description" content="Explore professional, responsive website design by Viji Web. Discover website designs for clinics, small businesses and service providers.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #1769aa;
  --navy: #102f58;
  --light-blue: #eaf4ff;
  --text: #263a52;
  --muted: #718198;
  --white: #ffffff;
  --green: #16836b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 85px;
}

body {
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  line-height: 1.65;
}

a {
  text-decoration: none;
  color: inherit;
}

button, input, textarea {
  font: inherit;
}

.container {
  width: min(1160px, 92%);
  margin: auto;
}

.demo-banner {
  background: #fff1cb;
  color: #72541b;
  padding: 7px 12px;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid #e6edf5;
}

nav {
  min-height: 76px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}

.logo {
  color: var(--navy);
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 25px;
  white-space: nowrap;
}

.logo span {
  color: var(--blue);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 25px;
  font-size: 13px;
  font-weight: 700;
}

.nav-links a:not(.button):hover {
  color: var(--blue);
}

.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 13px 20px;
  border: none;
  border-radius: 9px;
  background: var(--blue);
  color: white;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.button:hover {
  background: var(--navy);
  transform: translateY(-1px);
}

.button-white {
  background: white;
  color: var(--navy);
  border: 1px solid #dce8f5;
}

.button-white:hover {
  background: #edf6ff;
  color: var(--navy);
}

/* HERO: New Web Design Studio Image */

.hero {
  min-height: calc(100vh - 76px);
  min-height: calc(100svh - 76px);
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
  background-color: #dcecff;

  background-image:
    linear-gradient(
      90deg,
      rgba(8, 35, 75, .78) 0%,
      rgba(8, 35, 75, .56) 42%,
      rgba(8, 35, 75, .08) 100%
    ),
    url("./Cinematic%20Web%20Design%20Studio%20at%20Sunset.png");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

.hero-content {
  position: relative;
  z-index: 1;
  width: min(1160px, 92%);
  margin: auto;
  padding: 75px 0;
}

.hero-copy {
  max-width: 680px;
}

.eyebrow {
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.hero .eyebrow {
  color: #bce0ff;
}

.hero h1 {
  color: white;
  font-family: 'Manrope', sans-serif;
  font-size: clamp(39px, 5.3vw, 68px);
  line-height: 1.12;
  margin: 20px 0;
  letter-spacing: -1.5px;
}

.hero h1 span {
  color: #83cbff;
}

.hero-description {
  max-width: 550px;
  color: #edf5ff;
  font-size: 16px;
  line-height: 1.9;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin: 30px 0;
}

.hero-note {
  color: #e2edfa;
  font-size: 12px;
}

.hero-note span {
  margin-right: 7px;
  color: #a6e5d1;
}

/* HIGHLIGHTS */

.highlights {
  background: var(--navy);
  color: white;
}

.highlight-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.highlight {
  padding: 24px;
  text-align: center;
  border-right: 1px solid #ffffff25;
}

.highlight:last-child {
  border-right: 0;
}

.highlight strong {
  display: block;
  font-size: 15px;
}

.highlight p {
  color: #c6d9ee;
  font-size: 12px;
  margin-top: 4px;
}

/* GENERAL SECTIONS */

section.content-section {
  padding: 82px 0;
}

.section-heading {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 42px;
}

.section-heading h2 {
  font-family: 'Manrope', sans-serif;
  font-size: clamp(28px, 4vw, 42px);
  color: var(--navy);
  line-height: 1.25;
  margin: 12px 0;
}

.section-heading p {
  color: var(--muted);
  font-size: 14px;
}

/* SERVICES */

.services {
  background: white;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.service-card {
  background: white;
  border: 1px solid #e2ebf5;
  border-radius: 16px;
  padding: 27px;
  transition: .25s;
}

.service-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px #18385d12;
}

.service-icon {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 15px;
  background: var(--light-blue);
  font-size: 27px;
  margin-bottom: 20px;
}

.service-card h3 {
  color: var(--navy);
  font-family: 'Manrope', sans-serif;
  font-size: 18px;
  margin-bottom: 9px;
}

.service-card p {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}

/* ABOUT */

.about {
  background: #f2f8ff;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 55px;
  align-items: center;
}

.about-visual {
  min-height: 370px;
  border-radius: 22px;
  padding: 35px;
  display: flex;
  align-items: flex-end;
  background:
    linear-gradient(0deg, rgba(8,35,75,.68), transparent 80%),
    url("./Cinematic%20Web%20Design%20Studio%20at%20Sunset.png")
    center/cover no-repeat;
}

.about-visual p {
  color: white;
  font-family: 'Manrope', sans-serif;
  font-size: 25px;
  font-weight: 800;
}

.about-copy h2 {
  color: var(--navy);
  font-family: 'Manrope', sans-serif;
  font-size: clamp(30px, 4vw, 42px);
  line-height: 1.25;
  margin: 13px 0 18px;
}

.about-copy > p {
  color: var(--muted);
  font-size: 14px;
}

.check-list {
  list-style: none;
  margin: 22px 0 28px;
}

.check-list li {
  margin: 11px 0;
  font-size: 14px;
  font-weight: 600;
}

.check-list li::before {
  content: "✓";
  color: var(--green);
  font-weight: 800;
  margin-right: 12px;
}

/* PROJECT */

.projects {
  background: white;
}

.project-card {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  overflow: hidden;
  border: 1px solid #e2ebf5;
  border-radius: 22px;
  box-shadow: 0 15px 45px #18385d0b;
}

.project-image {
  min-height: 390px;
  background:
    linear-gradient(0deg, rgba(8,35,75,.12), transparent 60%),
    url("./CarePoint%20Clinic%20Team%20in%20a%20Bright%20Lobby.png")
    center/cover no-repeat;
}

.project-info {
  padding: 42px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}

.project-label {
  display: inline-block;
  color: var(--blue);
  background: var(--light-blue);
  padding: 6px 11px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
}

.project-info h3 {
  color: var(--navy);
  font-family: 'Manrope', sans-serif;
  font-size: clamp(27px, 3vw, 37px);
  line-height: 1.25;
  margin: 18px 0 14px;
}

.project-info p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 20px;
}

.project-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 26px;
}

.project-tags span {
  background: #f0f4f8;
  color: #52677e;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
}

/* CONTACT */

.contact {
  background: linear-gradient(125deg, #102f58, #1769aa);
  color: white;
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  align-items: center;
}

.contact-copy .eyebrow {
  color: #bde1ff;
}

.contact-copy h2 {
  font-family: 'Manrope', sans-serif;
  font-size: clamp(32px, 4vw, 44px);
  line-height: 1.2;
  margin: 17px 0;
}

.contact-copy > p {
  color: #d5e7f9;
  font-size: 14px;
  margin: 13px 0;
}

.contact-detail {
  margin-top: 27px;
  padding-top: 20px;
  border-top: 1px solid #ffffff35;
  color: #e2edfa;
  font-size: 14px;
}

.contact-detail p {
  margin: 8px 0;
}

.form-card {
  background: white;
  color: var(--text);
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 20px 50px #071e3b30;
}

.form-card h3 {
  color: var(--navy);
  font-family: 'Manrope', sans-serif;
  font-size: 24px;
}

.form-card > p {
  color: var(--muted);
  font-size: 12px;
  margin: 7px 0 22px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field.full {
  grid-column: 1 / -1;
}

.field label {
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
}

.field input, .field textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #dbe5f0;
  border-radius: 8px;
  outline: none;
  background: white;
  color: var(--text);
  font-size: 13px;
}

.field input:focus, .field textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px #1769aa18;
}

.field textarea {
  min-height: 100px;
  resize: vertical;
}

.form-card .button {
  width: 100%;
  margin-top: 18px;
}

.form-notice {
  color: var(--muted);
  font-size: 10px;
  margin-top: 14px;
}

#form-result {
  display: none;
  background: #e7f7ef;
  color: #126349;
  border-radius: 8px;
  padding: 12px;
  margin-top: 13px;
  font-size: 12px;
}

/* FOOTER */

footer {
  background: #0a2241;
  color: white;
  padding: 48px 0 20px;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 35px;
}

.footer-grid h3 {
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  margin-bottom: 15px;
}

.footer-grid p, .footer-grid a {
  color: #c4d5e8;
  font-size: 12px;
}

.footer-grid p {
  margin: 8px 0;
}

.footer-brand p {
  max-width: 330px;
  margin-top: 15px;
}

.footer-links a:hover {
  color: white;
}

.copyright {
  border-top: 1px solid #ffffff25;
  padding-top: 18px;
  margin-top: 30px;
  color: #b7c9df;
  font-size: 11px;
  text-align: center;
}

/* RESPONSIVE */

@media (max-width: 800px) {
  nav {
    padding: 14px 0;
    flex-wrap: wrap;
    gap: 13px;
  }

  .logo {
    font-size: 22px;
  }

  .nav-links {
    width: 100%;
    gap: 15px;
    flex-wrap: wrap;
  }

  .nav-links a {
    font-size: 12px;
  }

  .nav-links .button {
    padding: 10px 12px;
  }

  .hero {
    min-height: 82svh;
    background-position: 58% center;
  }

  .hero-content {
    padding-top: 55px;
    padding-bottom: 55px;
  }

  .hero-description {
    font-size: 14px;
  }

  .highlight-grid {
    grid-template-columns: 1fr;
  }

  .highlight {
    border-right: 0;
    border-bottom: 1px solid #ffffff25;
    padding: 17px;
  }

  .service-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .about-grid,
  .contact-grid,
  .project-card {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .about-visual {
    min-height: 310px;
  }

  .project-image {
    min-height: 300px;
  }

  .project-info {
    padding: 30px;
  }

  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }

  .footer-brand {
    grid-column: 1 / -1;
  }
}

@media (max-width: 520px) {
  .nav-links {
    gap: 10px;
  }

  .nav-links .button {
    width: 100%;
  }

  .hero {
    min-height: 80svh;
    background-position: 60% center;
  }

  .hero h1 {
    font-size: 39px;
  }

  .hero-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .hero-actions .button {
    width: 100%;
  }

  section.content-section {
    padding: 57px 0;
  }

  .service-grid {
    grid-template-columns: 1fr;
  }

  .project-image {
    min-height: 240px;
  }

  .project-info {
    padding: 23px;
  }

  .form-card {
    padding: 21px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .footer-grid {
    grid-template-columns: 1fr;
  }

  .footer-brand {
    grid-column: auto;
  }
}
</style>
</head>

<body>

<div class="demo-banner">
  VIJI WEB · WEBSITE DESIGN PORT
